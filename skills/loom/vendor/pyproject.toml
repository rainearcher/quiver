[project]
name = "mcp-loom"
version = "2.0.0"
description = "Command-line client for Loom's internal GraphQL API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
loom = "loom_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/loom_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
# T20 bans print(): every byte the CLI writes must go through loom_mcp.output.
select = ["T20"]
